<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>My-Calc</h1>
    </header>

    <main>
        <div class="screen">
            <input type="text">
        </div>

        <div class="keypad">
                <button class="child seven" data-type="number">7</button> 
                <button class="child eight" data-type="number">8</button>
                <button class="child nine" data-type="number">9</button>
                <button class="child multiply" data-type="operator">✖️</button>
                <button class="child four" data-type="number">4</button>
                <button class="child five" data-type="number">5</button>
                <button class="child six" data-type="number">6</button>
                <button class="child minus" data-type="operator">-</button>
                <button class="child one" data-type="number">1</button>
                <button class="child two" data-type="number">2</button>
                <button class="child three" data-type="number">3</button>
                <button class="child plus" data-type="operator">+</button>
                <button class="child zero" data-type="number">0</button>
                <button class="child result" data-type="equal">=</button>
                <button class="child clear" data-type="clear">Clear</button>
        </div>
    </main>

    <script src="script.js"></script>
    
</body>
</html>
