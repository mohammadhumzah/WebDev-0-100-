<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Index</title>
</head>
<body>

    <header>
        <h1>Calculate Your BMI Index NOW !!!</h1>
    </header>
    <main>
        <div class="main">
            <label for="weight">Enter Your Weight</label>
            <input type="number" min="0" id="weight" placeholder="Weight in kg" />

            <label for="height">Enter Your Height</label>
            <input type="number" min="0" id="height" placeholder="Height in cm">

            <button id="submission">Enter</button>
        </div>
    </main>

    <footer>
        <h3 id="results"></h3>
    </footer>

    <script src="script.js"></script>
</body>
</html>
